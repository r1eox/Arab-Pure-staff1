<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام جرد تقارير قسم السيناريو تيم</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 30px 20px;
      min-height: 100vh;
    }

    .wrapper { max-width: 1200px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 25px; }
    header h1 { font-size: 1.8rem; color: #60a5fa; margin-bottom: 8px; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

    .box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }
    .box label {
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 10px;
      color: var(--text-sub);
    }
    textarea {
      width: 100%;
      height: 380px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text-main);
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      line-height: 1.6;
      resize: none;
      outline: none;
      direction: ltr;
      text-align: left;
    }
    textarea:focus { border-color: var(--accent); }

    .full-width-box { margin-top: 20px; }
    .full-width-box textarea { height: 220px; }

    .input-author {
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .input-author input {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text-main);
      outline: none;
      font-size: 0.9rem;
      flex: 1;
    }
    .input-author input:focus { border-color: var(--accent); }

    .stats-bar {
      margin-top: 15px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 15px;
      font-size: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .stats-count { color: #60a5fa; font-weight: bold; }
    .stats-duplicates { color: #f87171; font-weight: bold; }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button.action-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-sub);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #10b981;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 0.9rem;
      opacity: 0;
      transition: all 0.3s ease;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <div class="wrapper">
    <header>
      <h1>نظام معالجة وجرد قسم السيناريو تيم</h1>
    </header>

    <div class="grid">
      <div class="box">
        <label>1. المدخلات (استبيانات السيناريو):</label>
        <textarea id="inputData" placeholder="الصق استبيانات قسم السيناريو تيم هنا..."></textarea>
      </div>
      <div class="box">
        <label>2. المخرجات (نتيجة الجرد المنسقة):</label>
        <textarea id="outputData" placeholder="ستظهر النتيجة هنا..." readonly></textarea>
        <div class="stats-bar">
          <div id="totalCount" class="stats-count">إجمالي العدد: 0</div>
          <div id="duplicateAlert" class="stats-duplicates" style="display: none;"></div>
        </div>
      </div>
    </div>

    <div class="box full-width-box">
      <div class="input-author">
        <label style="margin: 0; min-width: 140px;">منشئ التقرير (اسمك/المنشن):</label>
        <input type="text" id="authorName" placeholder="أدخل اسمك..." oninput="processData()">
      </div>
      <label>3. نموذج التقرير الأسبوعي (جاهز للنسخ):</label>
      <textarea id="reportData" readonly></textarea>
    </div>

    <div class="actions">
      <button class="action-btn" onclick="processData()">معالجة وتحديث</button>
      <button class="action-btn secondary" onclick="copyResult('outputData')">نسخ الجرد</button>
      <button class="action-btn secondary" onclick="copyResult('reportData')">نسخ التقرير الأسبوعي</button>
      <button class="action-btn secondary" onclick="clearAll()">مسح الكل</button>
    </div>
  </div>

  <div id="toast" class="toast">تم النسخ بنجاح!</div>

  <script>
    const OUT_OF_SERVICE_ROLE_ID = "1480638365937434808";
    const OUT_OF_SERVICE_ROLE_MENTION = `<@&${OUT_OF_SERVICE_ROLE_ID}>`;

    function removeFancyFont(text) {
      if (!text) return '';
      let str = text.normalize('NFKD');
      let clean = '';
      for (let i = 0; i < str.length; i++) {
        let code = str.charCodeAt(i);
        if (code >= 0xD835) {
          let codePoint = str.codePointAt(i);
          if (codePoint >= 0x1D400 && codePoint <= 0x1D419) clean += String.fromCharCode(65 + (codePoint - 0x1D400));
          else if (codePoint >= 0x1D41A && codePoint <= 0x1D433) clean += String.fromCharCode(97 + (codePoint - 0x1D41A));
          else if (codePoint >= 0x1D434 && codePoint <= 0x1D44D) clean += String.fromCharCode(65 + (codePoint - 0x1D434));
          else if (codePoint >= 0x1D44E && codePoint <= 0x1D467) clean += String.fromCharCode(97 + (codePoint - 0x1D44E));
          else if (codePoint >= 0x1D468 && codePoint <= 0x1D481) clean += String.fromCharCode(65 + (codePoint - 0x1D468));
          else if (codePoint >= 0x1D482 && codePoint <= 0x1D49B) clean += String.fromCharCode(97 + (codePoint - 0x1D482));
          else if (codePoint >= 0x1D5D4 && codePoint <= 0x1D5ED) clean += String.fromCharCode(65 + (codePoint - 0x1D5D4));
          else if (codePoint >= 0x1D5EE && codePoint <= 0x1D607) clean += String.fromCharCode(97 + (codePoint - 0x1D5EE));
          else if (codePoint >= 0x1D608 && codePoint <= 0x1D621) clean += String.fromCharCode(65 + (codePoint - 0x1D608));
          else if (codePoint >= 0x1D622 && codePoint <= 0x1D63B) clean += String.fromCharCode(97 + (codePoint - 0x1D622));
          else if (codePoint >= 0x1D63C && codePoint <= 0x1D655) clean += String.fromCharCode(65 + (codePoint - 0x1D63C));
          else if (codePoint >= 0x1D656 && codePoint <= 0x1D66F) clean += String.fromCharCode(97 + (codePoint - 0x1D656));
          i++;
        } else {
          clean += str[i];
        }
      }
      return clean.replace(/[\u0300-\u036f]/g, '').trim();
    }

    function cleanAndStandardizeRank(rawRank) {
      if (!rawRank) return '';
      let clean = removeFancyFont(rawRank);
      const standardRanks = [
        "Supervisor", "Mod", "Super Admin", "Head Admin", "Admin",
        "Controller", "Hand of the king", "Pre Master", "Master", "Advisor",
        "Operator", "Marshal", "Manager", "Director", "Executive",
        "President", "Commander", "Mythical", "Colonel", "Boss",
        "Big Boss", "CEO", "Co Founder", "Founder", "Consultant"
      ];
      const lowerClean = clean.toLowerCase();
      for (let rank of standardRanks) {
        if (lowerClean.includes(rank.toLowerCase())) return rank;
      }
      return clean;
    }

    function formatUserMention(rawInput) {
      if (!rawInput) return '';
      const digitMatch = rawInput.match(/\d{17,20}/);
      if (digitMatch) return `<@${digitMatch[0]}>`;
      let clean = rawInput.replace(/[\u200B-\u200D\uFEFF\u200F]/g, '').replace(/@+/g, '').trim();
      return `<@${clean}>`;
    }

    function processData() {
      const input = document.getElementById('inputData').value;
      const totalCountElem = document.getElementById('totalCount');
      const duplicateAlertElem = document.getElementById('duplicateAlert');
      const authorName = document.getElementById('authorName').value.trim();

      if (!input.trim()) {
        document.getElementById('outputData').value = '';
        document.getElementById('reportData').value = '';
        totalCountElem.textContent = 'إجمالي العدد: 0';
        duplicateAlertElem.style.display = 'none';
        return;
      }

      const lineSeparator = '`-----------------------------------------------------`';
      let result = `${lineSeparator}\n`;
      let processedCount = 0;
      let idTracker = {};

      let countNew = 0;
      let countOut = 0;
      let countBad = 0;
      let countActive = 0;

      // التقسيم الصارم فقط عند كلمة "منشن الشخص"
      const entries = input.split(/(?=منشن الشخص\s*:)/g);

      entries.forEach((entry) => {
        if (!entry.trim() || !entry.includes('منشن الشخص')) return;

        let data = { userMention: '', rank: '', finalEval: '' };
        const lines = entry.split(/\r?\n/);

        lines.forEach(line => {
          if (!line.includes(':')) return;
          const parts = line.split(':');
          const key = parts[0].trim();
          const val = parts.slice(1).join(':').trim();

          // المطابقة الدقيقة للمفاتيح المطلوبة فقط
          if (key === 'منشن الشخص') {
            data.userMention = val;
          } else if (key === 'الرتبة الادارية' || key === 'الرتبة  الادارية' || key.includes('الرتبة')) {
            data.rank = val;
          } else if (key === 'التقيم النهائي' || key === 'التقييم النهائي') {
            data.finalEval = val;
          }
        });

        // التأكد من استخراج منشن الشخص
        if (data.userMention) {
          processedCount++;
          
          let rawKey = data.userMention.replace(/[^0-9]/g, '');
          if (rawKey && rawKey.length >= 17) idTracker[rawKey] = (idTracker[rawKey] || 0) + 1;

          const cleanRank = cleanAndStandardizeRank(data.rank);
          const evalText = (data.finalEval || '').trim();
          const matchedOutRoleMention = evalText.match(/<@&\d{17,20}>/);
          const hasOutByKeyword = evalText.includes('خارج خدمة') || evalText.includes('خارج الخدمة') || evalText.includes('إجازة');
          const hasOutByRoleMention = /<@&\d{17,20}>/.test(evalText);
          const hasOutByConfiguredRole = evalText.includes(OUT_OF_SERVICE_ROLE_ID) || evalText.includes(OUT_OF_SERVICE_ROLE_MENTION);
          const isOutOfService = hasOutByKeyword || hasOutByRoleMention || hasOutByConfiguredRole;
          let finalRating = data.finalEval || 'سيء';

          if (finalRating.includes('جديد')) {
            countNew++;
          } else if (isOutOfService) {
            countOut++;
            finalRating = matchedOutRoleMention ? matchedOutRoleMention[0] : OUT_OF_SERVICE_ROLE_MENTION;
          } else if (finalRating.includes('سيء') || finalRating.includes('سئ')) {
            countBad++;
          } else if (['جيد جدا', 'ممتاز', 'ممتاز جدا'].some(r => finalRating.includes(r))) {
            countActive++;
          }

          let formattedMention = formatUserMention(data.userMention);
          result += `${formattedMention}\nالتقييم : ${finalRating}\nالرتبة الادارية : ${cleanRank}\n${lineSeparator}\n`;
        }
      });

      document.getElementById('outputData').value = result;
      totalCountElem.textContent = `إجمالي العدد: ${processedCount}`;

      const weeklyReport = `** كم العدد حالي بالقسم: ${processedCount}\n\n` +
        `كم عدد ماخذين اجازة : ${countOut} ( ${countNew}جديد)\n\n` +
        `عدد غير متفاعلين : ${countBad}\n\n` +
        `عدد المتفاعلين بالقسم : ${countActive}\n` +
        `هل يوجد ملاحظة بالقسم او حاب تطور شي من جميع نواحي : لايوجد يعطيكم العافية   \n\n` +
        `تم انشاء التقرير من قبل : ( ${authorName} ) **`;

      document.getElementById('reportData').value = weeklyReport;

      let duplicates = Object.keys(idTracker).filter(key => idTracker[key] > 1);
      if (duplicates.length > 0) {
        duplicateAlertElem.style.display = 'block';
        duplicateAlertElem.innerHTML = `⚠️ تنبيه: يوجد IDs مكررة: <br>${duplicates.map(d => `- ${d} (تكرر ${idTracker[d]} مرات)`).join('<br>')}`;
      } else {
        duplicateAlertElem.style.display = 'none';
      }
    }

    function copyResult(elementId) {
      const output = document.getElementById(elementId);
      if (!output.value) return;
      output.select();
      navigator.clipboard.writeText(output.value);
      showToast();
    }

    function clearAll() {
      document.getElementById('inputData').value = '';
      document.getElementById('outputData').value = '';
      document.getElementById('reportData').value = '';
      document.getElementById('authorName').value = '';
      document.getElementById('totalCount').textContent = 'إجمالي العدد: 0';
      document.getElementById('duplicateAlert').style.display = 'none';
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    document.getElementById('inputData').addEventListener('input', processData);
  </script>
</body>
</html>
